<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Strategy Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
    <h1>Europe Strategy Game</h1>
    <div id="map-container">
        <!-- SVG карта Европы -->
        <svg id="europe-map" viewBox="0 0 2000 1500"></svg>
    </div>
    <div id="info-panel">
        <h2 id="country-name">Выберите страну</h2>
        <p id="country-info">Информация о стране появится здесь.</p>
        <button id="develop-btn" disabled>Развивать экономику</button>
        <button id="move-army-btn" disabled>Переместить армию</button>
        <button id="next-turn-btn">Следующий год</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
